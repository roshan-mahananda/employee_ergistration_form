<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        .login-card h2 {
            margin-bottom: 8px;
            color: #1e293b;
            text-align: center;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-warning {
            background-color: #fef3c7;
            color: #92400e;
            border: 1px solid #fcd34d;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Portal Login</h2>
        <div id="alert-box" class="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCH9Xa6_e-UghuLRTbDufRLxqTIqM2Q-SY",
            authDomain: "company-registration-por-b180f.firebaseapp.com",
            projectId: "company-registration-por-b180f",
            storageBucket: "company-registration-por-b180f.firebasestorage.app",
            messagingSenderId: "818104939504",
            appId: "1:818104939504:web:ec302dc7ba77f339d5e335"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showAlert(msg, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = `alert alert-${type}`;
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                const userDoc = await getDoc(doc(db, "users", user.uid));

                if (!userDoc.exists()) {
                    showAlert("User account record not found.", "danger");
                    await signOut(auth);
                    return;
                }

                const userData = userDoc.data();

                if (userData.role === "admin") {
                    window.location.href = "admin.html";
                    return;
                }

                if (userData.status === "pending") {
                    showAlert("Access Denied: Account is pending admin approval.", "warning");
                    await signOut(auth);
                } else if (userData.status === "rejected") {
                    showAlert("Access Denied: Registration request rejected.", "danger");
                    await signOut(auth);
                } else if (userData.status === "approved") {
                    alert("Welcome! Access Granted.");
                    window.location.href = "company.html";
                }
            } catch (error) {
                showAlert(error.message, "danger");
            }
        });
    </script>
</body>

</html>
